<!DOCTYPE html>
<html>
<head>
    <title>Patient History</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #e8f0fe;
            color: #333;
            padding: 10px;
            margin: 0;
        }
        h2 {
            text-align: center;
            color: #1a73e8;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 100%;
            overflow-x: auto;
            display: block;
            background-color: white;
            border-radius: 8px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
            word-wrap: break-word;
        }
        th {
            background-color: #1a73e8;
            color: white;
        }
        .priority-1 { background-color: #f28b82; color: white; }
        .priority-2 { background-color: #fbbc04; color: black; }
        .priority-3 { background-color: #fff475; color: black; }
        .priority-4 { background-color: #ccff90; color: black; }
        a {
            display: inline-block;
            margin: 15px 0;
            text-decoration: none;
            background-color: #1a73e8;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            transition: 0.3s;
        }
        a:hover { background-color: #1558b0; }

        /* Responsive table */
        @media (max-width: 768px) {
            table, thead, tbody, th, td, tr {
                display: block;
            }
            tr {
                margin-bottom: 15px;
                border-bottom: 2px solid #ddd;
            }
            th { display: none; }
            td {
                text-align: right;
                padding-left: 50%;
                position: relative;
            }
            td::before {
                content: attr(data-label);
                position: absolute;
                left: 10px;
                width: 45%;
                font-weight: bold;
                text-align: left;
            }
        }
    </style>
</head>
<body>
    <h2>Patient History</h2>
    <table>
        {% for patient in patients %}
        <tr>
            <td data-label="ID">{{ patient[0] }}</td>
            <td data-label="Age">{{ patient[1] }}</td>
            <td data-label="Severity">{{ patient[2] }}</td>
            <td data-label="Heart Rate">{{ patient[3] }}</td>
            <td data-label="BP (Systolic/Diastolic)">{{ patient[4] }}/{{ patient[5] }}</td>
            <td data-label="Oxygen">{{ patient[6] }}</td>
            <td data-label="Consciousness">{{ patient[7] }}</td>
            <td data-label="Symptoms">{{ patient[8] }}</td>
            <td data-label="Priority" class="priority-{{ patient[9][9] }}">{{ patient[9] }}</td>
        </tr>
        {% endfor %}
    </table>
    <br>
    <a href="/">Go Back</a>
</body>
</html>
